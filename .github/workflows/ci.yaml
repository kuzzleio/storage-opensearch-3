name: CI

on:
  push:
    branches: [master, beta]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Unit + conformance (OpenSearch ${{ matrix.opensearch }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        opensearch: ["3.0.0", "3.9.0"]
    services:
      opensearch:
        image: docker.io/opensearchproject/opensearch:${{ matrix.opensearch }}
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          DISABLE_INSTALL_DEMO_CONFIG: "true"
          OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -fs http://localhost:9200/_cluster/health?wait_for_status=yellow"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
        env:
          OPENSEARCH_NODE: http://localhost:9200
